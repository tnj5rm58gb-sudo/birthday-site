
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ♡</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <p class="eyebrow">A SPECIAL DAY FOR YOU</p>

    <section id="opening">
      <h1>Happy Birthday</h1>
      <div class="cake">🎁</div>
      <button id="openButton">次に行く</button>
    </section>

    <section id="surprise" hidden>
      <div class="cake">🎂</div>
      <h1>誕生日おめでとう！</h1>
      <p>
        生まれてきてくれてありがとう<br>
      </p>
      <button id="letterButton">次に行く</button>
    </section>

    <section id="letter" hidden>
      <p>
        いつもありがとう<br>
        一緒にいる時間が大好きです<br>
        これからもたくさん思い出を作ろうね
      </p>
      <div class="photo-gallery">
        <img src="iti1.jpg" alt="ふたりの思い出">
        <img src="ni2.jpg" alt="大切な思い出">
        <img src="sann3.jpg" alt="三年目">
        </div>
      <p><center>ずっと大好きだよ<br>
        俺が迎えに行くね</center></p>
    </section>
  </main>
</body>
</html>
